<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var stored = localStorage.getItem("nova-theme");
        var pref = stored === "light" || stored === "dark" ? stored : "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var resolved = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-preference", pref);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <meta
      name="description"
      content="NOVA automatiza la selección de currículos y la primera entrevista con inteligencia artificial por voz, en español latinoamericano. Clasificación con evidencia en segundos y análisis el mismo día."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Italiana&display=swap"
      rel="stylesheet"
    />
    <title>NOVA — Filtrado de currículos y entrevistas con inteligencia artificial</title>
    <script src="/anime.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
